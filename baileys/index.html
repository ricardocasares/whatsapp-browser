<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>WhatsApp Baileys</title>
<style>:root{--bg:#111b21;--panel:#202c33;--border:#2a3942;--text:#e9edef;--muted:#8696a0;--accent:#00a884;--out:#005c4b;--in:#202c33;--chat:#0b141a}@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f0f2f5;--panel:#fff;--border:#e9edef;--text:#111b21;--muted:#667781;--out:#d9fdd3;--in:#fff;--chat:#efeae2}}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:15px}.hidden{display:none!important}.muted{color:var(--muted);padding:16px;font-size:14px}#qr-screen{justify-content:center;align-items:center;height:100%;padding:16px;display:flex}.card{background:var(--panel);border-radius:12px;flex-wrap:wrap;align-items:center;gap:32px;width:100%;max-width:720px;padding:32px;display:flex}.card .left{flex:260px}.card h1{margin:0 0 8px;font-size:22px;font-weight:500}.card p{color:var(--muted)}#qr-canvas{background:#fff;border-radius:8px;padding:8px}#qr-error{color:#f15c6d;white-space:pre-wrap;word-break:break-word;background:#f15c6d1f;border-left:3px solid #f15c6d;border-radius:6px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}#app{grid-template-columns:minmax(260px,30%) 1fr;height:100%;display:grid}#sidebar{border-right:1px solid var(--border);background:var(--panel);flex-direction:column;min-width:0;display:flex}#top{align-items:center;gap:8px;min-height:60px;padding:12px 16px;display:flex}#me{flex:1;font-weight:500}#status{color:var(--muted);border-bottom:1px solid var(--border);padding:4px 16px;font-size:12px}button{color:var(--muted);cursor:pointer;background:0 0;border:none;border-radius:6px;padding:6px 10px;font-size:14px}button:hover{color:var(--text);background:var(--border)}#chat-list{flex:1;overflow-y:auto}.chat{cursor:pointer;border-bottom:1px solid var(--border);flex-direction:column;gap:2px;padding:10px 16px;display:flex}.chat span{color:var(--muted);white-space:nowrap;text-overflow:ellipsis;font-size:13px;overflow:hidden}.chat.active,.chat:hover{background:var(--border)}#main{background:var(--chat);flex-direction:column;min-width:0;display:flex}#chat-header{background:var(--panel);min-height:60px;padding:16px;font-weight:500}#messages{flex-direction:column;flex:1;gap:4px;padding:16px 6%;display:flex;overflow-y:auto}.msg{white-space:pre-wrap;word-wrap:break-word;border-radius:8px;max-width:70%;padding:6px 10px}.msg.in{background:var(--in);align-self:flex-start}.msg.out{background:var(--out);align-self:flex-end}.msg .time{color:var(--muted);text-align:right;font-size:11px}.msg .sender{color:#53bdeb;font-size:12px;font-weight:500}#composer{background:var(--panel);gap:8px;padding:10px 16px;display:flex}#input{font:inherit;background:var(--bg);color:var(--text);border:none;border-radius:8px;outline:none;flex:1;padding:10px 12px}#send{background:var(--accent);color:#fff;font-weight:500}@media (width<=720px){#app{grid-template-columns:1fr}#main{display:none}}</style>
  <script type="module" crossorigin src="./assets/index-B49NEUW9.js"></script>
</head>
<body>
  <div id="qr-screen"><div class="card">
    <div class="left"><h1>WhatsApp in the browser, Baileys edition</h1><p>No server. The Baileys JavaScript library runs in this page and connects straight to WhatsApp.</p><p id="qr-hint"></p><pre id="qr-error" class="hidden"></pre></div>
    <canvas id="qr-canvas" class="hidden"></canvas>
  </div></div>
  <div id="app" class="hidden">
    <div id="sidebar"><div id="top"><span id="me"></span><button id="logout">Log out</button></div><div id="status"></div><div id="chat-list"></div></div>
    <div id="main"><div id="chat-header"></div><div id="messages"></div><div id="composer" class="hidden"><input id="input" placeholder="Type a message"><button id="send">Send</button></div></div>
  </div>
</body>
</html>
